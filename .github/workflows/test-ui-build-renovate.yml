name: Test UI build for Renovate PRs

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    # Only run if the PR head branch starts with 'renovate-'
    if: startsWith(github.head_ref, 'renovate-')

    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"
          cache-dependency-path: "ui/yarn.lock"

      # The lockfile is Yarn Berry (v4); the version is pinned by the
      # "packageManager" field in ui/package.json and activated by Corepack.
      - name: Enable Corepack
        run: corepack enable

      - name: Check Node and Yarn versions
        run: |
          node --version
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build application
        run: yarn build
